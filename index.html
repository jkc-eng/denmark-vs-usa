<style>
/* Layout: pop-poster world. White paper, ink outlines, hard offset shadows; each theme owns one flat color that floods its deck. Denmark = tomato, U.S. = ink. One deliberate light look. */
:root {
  --paper: #FFFFFF;
  --ink: #111111;
  --muted: #4A4A4A;
  --line: #111111;
  --soft: #F2F0EA;
  --dk: #FF4F2E;
  --dk-text: #D6341A; /* Denmark red for text under 24 px: 4.8:1 on white (the bright --dk is 3.3:1, fine for fills and big numerals) */
  --us: #111111;
  --surface: #FFFFFF;
  --seq-lo: #EFEDE6;
  --seq-hi: #111111;
  --good: #0F8A4F;
  --bad: #E0301E;
  --theme: #FFC93C;
  --font-display: "Bricolage Grotesque", "Arial Black", Arial, sans-serif;
  --font-mono: "DM Mono", ui-monospace, Menlo, monospace;
  --shadow: 6px 6px 0 var(--ink);
  --shadow-lg: 10px 10px 0 var(--ink);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-display); font-size: 17px; line-height: 1.45; font-optical-sizing: auto; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; touch-action: manipulation; }
a { touch-action: manipulation; }
a { color: var(--ink); text-decoration-thickness: 2px; text-underline-offset: 3px; }
:focus-visible { outline: 3px solid var(--dk); outline-offset: 3px; border-radius: 8px; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.dk { color: var(--dk-text); } .us { color: var(--us); }
.big.dk, .dk.big { color: var(--dk); }
.num { font-variant-numeric: tabular-nums; }
.label { font-family: var(--font-mono); font-weight: 500; font-size: 12.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink); }
.box { border: 3px solid var(--ink); border-radius: 20px; box-shadow: var(--shadow); }

/* ---------- Home ---------- */
.masthead { padding-block: 20px 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.brand { font-weight: 800; font-size: 24px; letter-spacing: -.01em; }
.brand i { font-style: normal; background: var(--ink); color: var(--paper); padding: 0 8px 2px; border-radius: 7px; margin: 0 2px; }
.hero { margin-top: 18px; background: var(--dk); border: 3px solid var(--ink); border-radius: 24px; box-shadow: var(--shadow-lg); padding: 26px 24px; display: grid; gap: 18px; align-items: center; }
.hero-num { margin: 0; font-weight: 800; font-size: clamp(110px, 30vw, 210px); line-height: .8; letter-spacing: -.03em; }
.hero-copy { margin: 0; font-size: clamp(20px, 2.6vw, 28px); line-height: 1.2; font-weight: 500; max-width: 30ch; text-wrap: pretty; }
.hero-copy strong { font-weight: 800; }
.dots57 { display: grid; grid-template-columns: repeat(19, minmax(0, 14px)); gap: 6px; margin-top: 16px; }
.dots57 i { aspect-ratio: 1; border-radius: 50%; background: var(--ink); animation: pop .45s both; animation-delay: calc(var(--i) * 16ms); }
.dots-cap { font-family: var(--font-mono); font-size: 12.5px; margin: 10px 0 0; }
@media (min-width: 820px) { .hero { grid-template-columns: auto 1fr; gap: 40px; padding: 34px 40px; } }
@keyframes pop { from { transform: scale(.2); opacity: .2; } to { transform: none; opacity: 1; } }

.section-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-top: 34px; }
.section-h h2 { font-weight: 800; font-size: 30px; margin: 0; letter-spacing: -.01em; }
.tiles { display: grid; grid-template-columns: 1fr; gap: 18px; padding-block: 14px 8px; }
@media (min-width: 720px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 1000px) { .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 719px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; } .tile { padding: 12px; min-height: 0; gap: 10px; border-radius: 16px; } .tile .h3 { font-size: 21px; } .tile .p { font-size: 11px; } .tile.quiz .h3 { font-size: 56px; } .tile-photo { border-radius: 10px; border-width: 2.5px; } }
.tile { text-align: left; cursor: pointer; background: var(--tc, var(--soft)); border: 3px solid var(--ink); border-radius: 20px; box-shadow: var(--shadow); padding: 20px; min-height: 190px; display: flex; flex-direction: column; justify-content: space-between; gap: 18px; transition: transform .15s ease, box-shadow .15s ease; }
.tile:hover { transform: translate(-2px, -2px); box-shadow: 8px 8px 0 var(--ink); }
.tile:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 var(--ink); }
.tile .h3 { font-weight: 800; font-size: clamp(30px, 4vw, 40px); line-height: .95; letter-spacing: -.02em; }
.tile .p { font-family: var(--font-mono); font-size: 13px; text-transform: uppercase; letter-spacing: .04em; }
.tile .icons-art { display: flex; gap: 8px; flex-wrap: wrap; }
.tile .icons-art svg { width: 38px; height: 38px; }
.tile.quiz { background: var(--ink); color: var(--paper); }
.tile.quiz .h3 { font-size: 88px; line-height: .8; }
.tile.quiz { justify-content: space-between; }
.soonlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 14px; padding-block: 10px 30px; }
.soonitem { background: var(--tc); border: 3px solid var(--ink); border-radius: 16px; padding: 14px 16px; display: grid; gap: 6px; opacity: .9; }
.soonitem .h3 { font-weight: 800; font-size: 21px; line-height: 1; }
.soonitem .p { font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; }
.foot { border-top: 3px solid var(--ink); padding-block: 14px 30px; font-family: var(--font-mono); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: space-between; }
.linkbtn { background: none; border: 0; padding: 0; text-decoration: underline; text-decoration-thickness: 2px; cursor: pointer; font: inherit; }

/* ---------- Deck pages ---------- */
.page { min-height: 100%; background: var(--theme); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--ink); color: var(--paper); }
.bar .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.back { background: var(--paper); color: var(--ink); border: 0; border-radius: 999px; cursor: pointer; padding: 6px 14px; font-weight: 800; font-size: 14px; }
.bar .title { font-weight: 800; font-size: 18px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .count { font-family: var(--font-mono); font-size: 13px; }
.progress { height: 6px; background: rgba(0,0,0,.18); }
.progress i { display: block; height: 100%; background: var(--ink); transition: width .35s ease; }
.deckmain { padding-block: 26px 130px; touch-action: pan-y; }
.card { max-width: 820px; margin: 0 auto; display: grid; gap: 18px; animation: cardin .22s ease-out both; }
.card.from-left { animation-name: cardinl; }
@keyframes cardin { from { transform: translateX(26px); opacity: .3; } to { transform: none; opacity: 1; } }
@keyframes cardinl { from { transform: translateX(-26px); opacity: .3; } to { transform: none; opacity: 1; } }
.kicker { justify-self: start; font-family: var(--font-mono); font-size: 12.5px; text-transform: uppercase; letter-spacing: .05em; background: var(--paper); border: 2.5px solid var(--ink); border-radius: 999px; padding: 4px 12px; }
.card .q { font-weight: 800; font-size: clamp(34px, 6vw, 58px); line-height: .96; margin: 0; letter-spacing: -.025em; text-wrap: balance; }
.viz { background: var(--paper); border: 3px solid var(--ink); border-radius: 20px; box-shadow: var(--shadow); padding: 18px; display: grid; gap: 18px; min-width: 0; }
.answer { font-size: clamp(20px, 2.8vw, 26px); line-height: 1.25; margin: 0; font-weight: 500; text-wrap: pretty; }
.answer strong { font-weight: 800; }
.context { margin: 0; font-size: 16.5px; max-width: 62ch; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.chipbtn { border: 2.5px solid var(--ink); background: var(--paper); border-radius: 999px; padding: 8px 15px; cursor: pointer; font-size: 15px; font-weight: 800; display: inline-flex; gap: 8px; align-items: center; box-shadow: 3px 3px 0 var(--ink); }
.chipbtn[aria-expanded="true"] { background: var(--ink); color: var(--paper); }
.chipbtn .i { width: 18px; height: 18px; border-radius: 50%; border: 2px solid currentColor; display: grid; place-items: center; font-size: 11px; font-weight: 800; font-family: Georgia, serif; font-style: italic; }
.panel { background: var(--paper); border: 3px solid var(--ink); border-radius: 18px; padding: 16px 18px; font-size: 15px; min-width: 0; }
.panel ul { margin: 0; padding-left: 18px; display: grid; gap: 8px; }
.panel .note { color: var(--muted); margin: 10px 0 0; }

.row { display: grid; gap: 8px; }
.row-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.cname { font-weight: 800; font-size: 17px; }
.big { font-weight: 800; font-size: 44px; line-height: .9; letter-spacing: -.03em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sub { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); }

.icons { display: flex; flex-wrap: wrap; gap: 4px; }
.ic { position: relative; display: block; }
.ic svg { display: block; width: 100%; height: auto; }
.ic .ghost { opacity: .15; }
.ic .fill { position: absolute; inset: 0; }
.anim .ic { animation: pop .35s both; animation-delay: calc(var(--i) * 9ms); }
.dkc { color: var(--dk-text); } .usc { color: var(--us); }

/* Interactive panels */
.viz.stage { padding: 18px 16px 16px; }
.phys-head { display: flex; justify-content: space-between; gap: 10px; }
.phys-head .cname { display: block; }
.phys-head .big { font-size: 56px; }
#gunbox { width: 100%; max-width: 600px; height: auto; aspect-ratio: 400 / 330; display: block; margin: 0 auto; touch-action: pan-y; }
.stage-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.ghostbtn { background: var(--ink); color: var(--paper); border: 0; border-radius: 999px; padding: 10px 18px; font-weight: 800; cursor: pointer; font-size: 15px; box-shadow: 3px 3px 0 var(--dk); }
.ghostbtn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--dk); }
@media (pointer: coarse) { .finehint { display: none; } }
.race { display: grid; gap: 14px; }
.race-date { display: grid; }
.racedate { font-weight: 800; font-size: clamp(48px, 10vw, 84px); line-height: .9; letter-spacing: -.04em; }
.lane { display: grid; gap: 6px; }
.lane-h { display: flex; justify-content: space-between; align-items: end; }
.track { position: relative; height: 26px; border-radius: 999px; background: var(--soft); border: 2.5px solid var(--ink); overflow: hidden; }
.track .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; }
.dkbg { background: var(--dk); } .usbg { background: var(--ink); }
.flag { display: block; font-family: var(--font-mono); font-size: 12.5px; color: var(--dk-text); font-weight: 500; }
.months { display: grid; grid-template-columns: repeat(12, 1fr); font-family: var(--font-mono); font-size: 12px; }
#r-scrub { width: 100%; accent-color: var(--ink); height: 28px; }

/* Guess */
.guess { display: grid; gap: 14px; }
.guess output { font-weight: 800; font-size: 96px; line-height: .85; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.guess input[type=range] { width: 100%; accent-color: var(--ink); height: 32px; }
.scale { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 12.5px; }
.primary { background: var(--ink); color: var(--paper); border: 0; border-radius: 999px; padding: 13px 24px; font-weight: 800; cursor: pointer; justify-self: start; font-size: 17px; box-shadow: 4px 4px 0 var(--dk); }
.primary:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--dk); }
.yourguess { font-size: 16px; padding: 10px 14px; border-radius: 14px; background: var(--paper); border: 2.5px solid var(--ink); margin: 0; }

/* Calendar */
.weeks { display: flex; flex-wrap: wrap; gap: 8px; }
.week { display: grid; grid-template-columns: repeat(5, 18px); gap: 3px; }
.day { width: 18px; height: 18px; border-radius: 4px; border: 2px dashed #B9B5AA; }
.day.on-dk { background: var(--dk); border: 2px solid var(--ink); }
.day.on-us { background: var(--ink); border: 2px solid var(--ink); }
.anim .day { animation: pop .3s both; animation-delay: calc(var(--i) * 20ms); }

/* Tile map */
.tmap { display: grid; gap: 10px; }
.tmap svg { width: 100%; height: auto; display: block; max-width: 580px; }
.tmap rect { transition: opacity .15s; cursor: pointer; }
.tmap .lab { font-family: var(--font-mono); font-weight: 500; font-size: 9px; pointer-events: none; }
.tmap .cast { font-weight: 800; }
.readout { min-height: 1.5em; font-size: 15.5px; margin: 0; }
.legend { display: grid; gap: 4px; max-width: 380px; }
.legend .ramp { height: 12px; border-radius: 6px; position: relative; border: 2px solid var(--ink); }
.legend .ends { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 12px; }
.legend .mark { position: absolute; top: -7px; width: 5px; height: 22px; background: var(--dk); border: 1.5px solid var(--ink); border-radius: 3px; transform: translateX(-2px); }
.legend .marklab { color: var(--dk-text); font-weight: 500; }

/* Nav */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--paper); border-top: 3px solid var(--ink); padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav .wrap { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 10px; max-width: 820px; }
.navbtn { border: 2.5px solid var(--ink); background: var(--paper); border-radius: 999px; padding: 10px 18px; font-weight: 800; cursor: pointer; min-width: 104px; }
.navbtn.next { background: var(--ink); color: var(--paper); box-shadow: 3px 3px 0 var(--dk); }
.navbtn[disabled] { opacity: .3; cursor: default; box-shadow: none; }
.pips { display: flex; gap: 7px; }
.pips button { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--ink); padding: 0; background: var(--paper); cursor: pointer; }
.pips button[aria-current="true"] { background: var(--ink); }

/* End card + quiz */
.endcard { display: grid; gap: 16px; }
.opts { display: grid; gap: 12px; }
.opt { text-align: left; border: 3px solid var(--ink); background: var(--paper); border-radius: 16px; padding: 15px 18px; cursor: pointer; font-size: 19px; font-weight: 800; display: flex; justify-content: space-between; gap: 10px; box-shadow: 4px 4px 0 var(--ink); }
.opt:hover:not([disabled]) { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--ink); }
.opt[disabled] { cursor: default; }
.opt.right { background: #9BE3B5; }
.opt.wrong { background: #FFB4A6; }
.feedback { display: grid; gap: 10px; }
.verdict { font-weight: 800; font-size: 34px; margin: 0; letter-spacing: -.02em; }
.score { font-weight: 800; font-size: 160px; line-height: .8; margin: 0; letter-spacing: -.06em; }
.srcs { display: grid; gap: 14px; padding-block: 16px 40px; max-width: 820px; }
.srcs h2 { font-weight: 800; font-size: 40px; margin: 10px 0 0; letter-spacing: -.02em; }
.srcs li { margin-bottom: 8px; }
.srcs .box { background: var(--paper); padding: 18px 22px; }

/* Shared interactive bits */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 2.5px solid var(--ink); background: var(--paper); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-weight: 800; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.seg { display: inline-flex; border: 2.5px solid var(--ink); border-radius: 999px; overflow: hidden; }
.seg button { border: 0; background: var(--paper); padding: 7px 14px; font-weight: 800; font-size: 14px; cursor: pointer; }
.seg button + button { border-left: 2.5px solid var(--ink); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.ppl { position: relative; width: 100%; aspect-ratio: 1; }
.ppl .pi { position: absolute; left: 0; top: 0; width: 10%; height: 10%; padding: 1.5%; transform: translate(calc(var(--x) * 100%), calc(var(--y) * 100%)); transition: transform .9s cubic-bezier(.65, 0, .25, 1), color .4s; transition-delay: calc(var(--d, 0) * 6ms); }
.ppl .pi svg { display: block; width: 100%; height: 100%; overflow: visible; }
.ppl .pi svg * { stroke: var(--ink); stroke-width: 1.3; vector-effect: non-scaling-stroke; }
.lgd { display: grid; gap: 6px; font-size: 14.5px; margin: 0; padding: 0; list-style: none; }
.lgd li { display: flex; align-items: center; gap: 8px; }
.lgd .sw { width: 16px; height: 16px; border-radius: 4px; border: 2px solid var(--ink); flex: none; }
.lgd .n { font-family: var(--font-mono); font-weight: 500; min-width: 2.2em; text-align: right; }
.two { display: grid; gap: 22px; }
@media (min-width: 640px) { .two { grid-template-columns: 1fr 1fr; gap: 26px; } }
.two.keep { grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 639px) { .two.keep .big { font-size: 34px; } .two.keep .cname { font-size: 15px; } }
.two.keep > * { min-width: 0; }
@media (max-width: 379px) { .two.keep { gap: 10px; } .two.keep .big { font-size: 27px; } .two.keep .cname { font-size: 14px; } }
.pair { display: flex; gap: 22px; align-items: end; }
.pair > span { display: grid; gap: 2px; }
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { font-family: var(--font-mono); font-size: 11.5px; fill: var(--ink); }
.note-pop { margin: 0; font-size: 15.5px; min-height: 2.8em; padding: 10px 14px; border-radius: 14px; background: var(--soft); border: 2.5px solid var(--ink); }
input[type=range].scrub { width: 100%; accent-color: var(--ink); height: 28px; }

/* People */
.szmap { width: 100%; height: auto; display: block; touch-action: pan-y; }
.szmap .st path { fill: var(--soft); stroke: var(--ink); stroke-width: 1; cursor: pointer; transition: fill .2s; }
.szmap .st path:hover { fill: #E6E2D6; }
.szmap .st path.on { fill: #FFE6A6; }
.dkg { cursor: grab; touch-action: none; }
.dkg.drag { cursor: grabbing; }
.dkg path { fill: var(--dk); stroke: var(--ink); stroke-width: 2.5; stroke-linejoin: round; }
.dkg .hit { fill: transparent; }
.dkg.drag path { filter: drop-shadow(4px 4px 0 var(--ink)); }
.sq { width: 100%; height: auto; display: block; border: 3px solid var(--ink); border-radius: 10px; background: var(--paper); }
.sq .sqbg { fill: var(--paper); }
.sq .dots circle { animation: pop .3s both; animation-delay: calc(var(--i) * 2ms); }
.sq .dkdots circle { fill: var(--dk); }
.sq .usdots circle { fill: var(--ink); }
.chart .gl { stroke: #D9D5CA; stroke-width: 1; }
.chart .ln { fill: none; stroke-width: 3.5; stroke-linejoin: round; }
.chart .ln.us { stroke: var(--ink); }
.chart .ln.dk { stroke: var(--dk); }
.chart .pt.us { fill: var(--paper); stroke: var(--ink); stroke-width: 2; }
.chart .cur { stroke: var(--ink); stroke-width: 2; stroke-dasharray: 4 3; }
.chart .lab { font-family: var(--font-display); font-weight: 800; font-size: 14px; }
.chart .lab.dk { fill: var(--dk-text); }
.chart .hd { font-family: var(--font-display); font-weight: 800; font-size: 13px; }
.pyr .b { transition: opacity .3s; }
.pyr .b.dk { fill: var(--dk); opacity: .9; }
.pyr .b.us { fill: none; stroke: var(--ink); stroke-width: 2.2; }

.pyr .hitrow { fill: transparent; cursor: pointer; }

/* Photos */
.photo, .cmp { margin: 0; background: var(--paper); border: 3px solid var(--ink); border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; }
.photo.flat { box-shadow: none; border-width: 2.5px; border-radius: 14px; }
.panel .photo { max-width: 560px; }
.photo img { display: block; width: 100%; height: auto; aspect-ratio: var(--ar, 3 / 2); object-fit: cover; }
.photo figcaption, .cmp figcaption { padding: 12px 16px 14px; border-top: 3px solid var(--ink); display: grid; gap: 5px; font-size: 15.5px; line-height: 1.35; }
.photo figcaption strong, .cmp figcaption strong { font-weight: 800; }
.credit { font-family: var(--font-mono); font-size: 11.5px; line-height: 1.45; color: var(--muted); }
.credit a { color: var(--muted); text-decoration-thickness: 1px; }
.cmp-stage { position: relative; aspect-ratio: 3 / 2; touch-action: pan-y; cursor: ew-resize; user-select: none; -webkit-user-select: none; --pos: 50%; overflow: hidden; }
.cmp-stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; -webkit-user-drag: none; }
.cmp-stage .a { position: absolute; inset: 0; clip-path: inset(0 calc(100% - var(--pos)) 0 0); }
.cmp-stage:focus-within { outline: 3px solid var(--dk); outline-offset: -6px; }
.cmp-line { position: absolute; top: 0; bottom: 0; left: var(--pos); width: 4px; margin-left: -2px; background: var(--paper); box-shadow: 0 0 0 1.5px var(--ink); pointer-events: none; }
.cmp-knob { position: absolute; top: 50%; left: var(--pos); width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%; background: var(--paper); border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); display: grid; place-items: center; font-weight: 800; font-size: 20px; line-height: 1; pointer-events: none; }
.cmp-tag { position: absolute; top: 12px; font-family: var(--font-mono); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; padding: 4px 10px; border: 2.5px solid var(--ink); border-radius: 999px; pointer-events: none; white-space: nowrap; }
.cmp-tag.l { left: 12px; background: var(--dk); color: var(--ink); }
.cmp-tag.r { right: 12px; background: var(--ink); color: var(--paper); }
.cmp-range { position: absolute; left: 0; bottom: 0; width: 100%; margin: 0; opacity: 0; pointer-events: none; }
.tile-photo { display: block; border: 3px solid var(--ink); border-radius: 14px; overflow: hidden; aspect-ratio: 16 / 9; background: var(--soft); }
.tile-photo img { display: block; width: 100%; height: 100%; object-fit: cover; }

/* Money */
.hbars { display: grid; gap: 12px; }
.hb { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 4px 10px; }
.hb .big { font-size: 38px; }
.hb-track { grid-column: 1 / -1; height: 22px; border-radius: 999px; background: var(--soft); border: 2.5px solid var(--ink); overflow: hidden; }
.hb-track i { display: block; height: 100%; transition: width .7s cubic-bezier(.6,0,.2,1); }
.swarm .sw-st { fill: var(--soft); stroke: var(--ink); stroke-width: 1.4; cursor: pointer; }
.swarm .sw-st.cast { fill: var(--ink); }
.swarm .sw-dk { fill: var(--dk); stroke: var(--ink); stroke-width: 2.5; cursor: pointer; }
.swarm circle.sw-st.on { stroke: var(--ink); stroke-width: 4; fill: #FFC93C; }
.swarm circle.sw-dk.on { fill: var(--dk); }
.swarm circle { animation: pop .4s both; }
.swarm .sw-dc { font-size: 11px; fill: var(--muted); }
.lgd-row { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13.5px; }
.lgd .sw-me { background: repeating-linear-gradient(90deg, #8A8A8A 0 5px, transparent 5px 8px); border-color: #8A8A8A; }
.ladder .bar { transform-box: fill-box; transform-origin: bottom; animation: grow .8s cubic-bezier(.3,.7,.2,1) both; animation-delay: calc(var(--j) * 90ms); stroke: var(--ink); stroke-width: 2.5; }
.ladder .dk .bar { fill: var(--dk); }
.ladder .us .bar { fill: var(--ink); }
.ladder .who, .ladder .val { animation: fadein .4s both; animation-delay: calc(var(--j) * 90ms + .7s); }
.ladder .who path { fill: var(--ink); }
.ladder .dk .who path { fill: var(--dk); stroke: var(--ink); stroke-width: 1.4; }
.ladder .val { font-family: var(--font-display); font-weight: 800; font-size: 15px; }
.ladder text { font-size: 12.5px; }
.ladder .hd { font-size: 16px; }
.ladder .hit { fill: transparent; cursor: pointer; }
.ladder .lgrp.on .hit { fill: #F2F0EA; }
@keyframes grow { from { transform: scaleY(0); } to { transform: none; } }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
.phys-head .big.fit { font-size: clamp(38px, 11vw, 56px); }
#coinbox { width: 100%; max-width: 560px; height: auto; aspect-ratio: 400 / 250; display: block; margin: 0 auto; }
.whopays { display: grid; border-top: 3px solid var(--ink); padding-top: 12px; }
.who-r { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; padding: 10px 0; border-bottom: 1.5px solid #D9D5CA; font-size: 14.5px; line-height: 1.3; }
.who-r:last-child { border-bottom: 0; }
.who-k { grid-column: 1 / -1; font-weight: 800; font-size: 15.5px; }
.who-h { padding-top: 0; }
.who-h .who-k { display: none; }
.who-dk { border-left: 4px solid var(--dk); padding-left: 8px; }
.who-us { border-left: 4px solid var(--ink); padding-left: 8px; }
@media (min-width: 640px) { .who-r { grid-template-columns: 1.1fr 1fr 1fr; } .who-k { grid-column: auto; } .who-h .who-k { display: block; } }
.drawwrap { touch-action: none; }
.unions #dr-area { cursor: crosshair; touch-action: none; }
.chart .ln.me { stroke: #8A8A8A; stroke-dasharray: 7 5; stroke-width: 3.5; }
.chart .ln.mine { stroke: var(--ink); stroke-width: 4; stroke-linecap: round; }
.drhint text { font-family: var(--font-display); font-weight: 800; font-size: 15px; fill: var(--muted); }
.drhint { transition: opacity .3s; animation: nudge 1.6s ease-in-out infinite; }
@keyframes nudge { 50% { transform: translateX(6px); } }
.primary[disabled] { opacity: .35; cursor: default; box-shadow: none; }
.chart .ln.drawin { stroke-dasharray: 1; stroke-dashoffset: 1; animation: drawln 1.8s ease-out forwards; }
.chart .ln.dk.drawin { animation-delay: .5s; }
@keyframes drawln { to { stroke-dashoffset: 0; } }
.unions #un-area { cursor: ew-resize; }
.pricetag { justify-self: start; display: grid; gap: 2px; background: #FFC93C; border: 3px solid var(--ink); border-radius: 14px 30px 30px 14px; box-shadow: 4px 4px 0 var(--ink); padding: 10px 26px 12px 16px; }
.pricetag .pt-main { font-weight: 800; font-size: 26px; line-height: 1.05; }
.pricetag .pt-main .num { font-size: 34px; }

.mwchart .ln.nom { stroke: #8A8A8A; stroke-width: 2.5; stroke-dasharray: 5 4; }
.mwchart .nomlab { fill: var(--muted); }
.mwchart .mw-ndot { fill: var(--paper); stroke: #8A8A8A; stroke-width: 2.5; }
.mwchart .mw-y { font-size: 14px; }
.mwchart .mw-v { font-size: 15px; }

/* Health */
.gapline { margin: -4px 0 0; font-size: 19px; font-weight: 500; }
.gapline strong { font-weight: 800; }
.chart .dkpt { fill: var(--dk); stroke: var(--ink); stroke-width: 2; }
.scatter .hs { fill: var(--soft); stroke: var(--ink); stroke-width: 1.4; cursor: pointer; }

.scatter .hs-us { fill: var(--ink); }

.ppl .pi.dim { opacity: .18; }

.scen { display: grid; gap: 10px; min-height: 3em; }

.viz .chart { max-width: 660px; margin-inline: auto; }

/* two 100-people grids side by side: same size, top-aligned, headings of equal height so the grids line up */

.two.ppl2 > .row { align-content: start; }
.two.ppl2 > .row > * { align-self: start; }
.two > .row { grid-template-columns: minmax(0, 1fr); } /* a column can never grow past its half (turnout grids were 171 vs 165 px on phones) */
@media (min-width: 640px) { .two.ppl2 { grid-template-rows: auto auto auto; row-gap: 8px; } .two.ppl2 > .row { grid-row: span 3; grid-template-rows: subgrid; } }

/* Society */
.cells { display: grid; grid-template-columns: repeat(20, minmax(0, 1fr)); gap: 3px; max-width: 520px; }
.cells i, .cellkey { display: block; aspect-ratio: 1; border-radius: 2px; border: 1.5px solid #D9D5CA; background: transparent; transition: background .3s, border-color .3s; transition-delay: calc(var(--i) * 6ms); }
.cells i.on, .cellkey { border-color: var(--ink); background: repeating-linear-gradient(90deg, var(--ink) 0 1.6px, var(--paper) 1.6px 4.2px); }

.homchart .hb0 { fill: var(--soft); stroke: var(--ink); stroke-width: 2; transform-box: fill-box; transform-origin: left; animation: growx .7s cubic-bezier(.3,.7,.2,1) both; animation-delay: calc(var(--j) * 70ms); }
.homchart .us .hb0 { fill: var(--ink); }
.homchart .dk .hb0 { fill: var(--dk); }
.homchart .hbgun { fill: url(#none); fill: transparent; stroke: none; }
.homchart.gun .us .hb0 { fill: #8A8A8A; }
.homchart.gun .hbgun { fill: var(--ink); stroke: var(--ink); stroke-width: 2; }
.homchart .hv { font-family: var(--font-display); font-weight: 800; font-size: 14px; }
@keyframes growx { from { transform: scaleX(0); } to { transform: none; } }
.chipbtn[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.leave { display: grid; gap: 8px; }
.lv-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.lv-row { display: grid; grid-template-columns: 86px 1fr 34px; gap: 10px; align-items: center; }

.wks i.pre { background: #FFB4A6; }
.wks i.ear { background: #B8321B; }
.wks i.dk { background: var(--dk); }
.wks i.unpaid { background: repeating-linear-gradient(45deg, var(--paper) 0 2px, #8A8A8A 2px 3.5px); }

@media (min-width: 640px) { .lv-row { grid-template-columns: 150px 1fr 40px; } .wks i { width: 16px; height: 16px; } }

.paint:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; border-radius: 6px; }
.hemiwrap { position: relative; max-width: 560px; margin-inline: auto; width: 100%; }
.hemi { width: 100%; height: auto; display: block; }
.hemi circle { stroke: var(--ink); stroke-width: .8; cursor: pointer; transform-box: fill-box; transform-origin: center; animation: popin .35s both; animation-delay: calc(var(--d) * 2ms); transition: opacity .3s; }
.hemi circle.dim { opacity: .16; }
.hemi-n { position: absolute; left: 50%; bottom: 2px; transform: translateX(-50%); text-align: center; display: grid; justify-items: center; line-height: 1; pointer-events: none; }

.meter { position: relative; height: 14px; border: 2.5px solid var(--ink); border-radius: 999px; background: var(--paper); max-width: 560px; margin-inline: auto; width: 100%; }
.meter .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--ink); border-radius: 999px; transition: width .35s, background .3s; }

.ptys { display: flex; flex-wrap: wrap; gap: 6px; }
.pty { display: inline-flex; align-items: center; gap: 6px; border: 2px solid var(--ink); background: var(--paper); color: var(--ink); border-radius: 999px; padding: 4px 10px 4px 5px; font: inherit; font-size: 13.5px; cursor: pointer; }
.pty .sw { width: 15px; height: 15px; border-radius: 50%; border: 1.5px solid var(--ink); flex: none; }
.pty b { font-weight: 800; }
.pty .n { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); }
.pty[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.pty[aria-pressed="true"] .n { color: var(--paper); }
.abcap { margin: 4px 0 -6px; }
.abchart { max-width: 560px; margin-inline: auto; }
.abchart text { font-family: var(--font-display); font-size: 14.5px; }
.abchart .hd { font-weight: 800; font-size: 16px; }
.abchart .tick { stroke: #DDD9CE; stroke-width: 1; }
.abchart .axl, .dpchart .axl, .rachart .axl, .dpst .axl { font-family: var(--font-mono); font-size: 11px; fill: var(--muted); font-weight: 400; }
.abchart .abrow { fill: transparent; }
.abchart .cnt:not(.in), .abchart .dkline .dkv { paint-order: stroke; stroke: var(--paper); stroke-width: 6px; stroke-linejoin: round; }
.abchart .ab { fill: var(--ink); transform-box: fill-box; transform-origin: left center; transition: transform .9s cubic-bezier(.65,0,.25,1), opacity .25s; }
.abchart .rl { font-weight: 600; }
.abchart .cnt { font-weight: 800; }
.abchart .cnt.in { fill: var(--paper); }
.abchart .rl, .abchart .cnt { opacity: 0; transition: opacity .3s; }
.abchart.now .rl, .abchart.now .cnt { opacity: 1; transition-delay: .55s; }

.abchart.sel .rl:not(.hi), .abchart.sel .cnt:not(.hi) { opacity: .4; }
.abchart .abrow { cursor: pointer; }
.abchart:not(.now) .abrow { pointer-events: none; }
.abchart .roe-in { font-size: 14px; font-weight: 600; transition: opacity .3s .55s; }
.abchart .roe-in .b { font-weight: 800; }
.abchart.now .roe-in { opacity: 0; transition-delay: 0s; }
.abchart .dkbar { fill: var(--dk); stroke: var(--ink); stroke-width: 2; transform-box: fill-box; transform-origin: left; transition: transform .9s cubic-bezier(.65,0,.25,1); }
.abchart .dkline { transition: transform .9s cubic-bezier(.65,0,.25,1); }
.abchart .dkline line { stroke: var(--dk); stroke-width: 2.5; stroke-dasharray: 5 3; }
.abchart .dkline text { fill: var(--dk-text); font-weight: 800; }
.abchart .dkline .dkv { fill: var(--ink); }
.dprow { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding: 8px 12px; border: 2.5px solid var(--dk); border-radius: 12px; }
.dprow .cname { color: var(--dk-text); }
.dpchart .eb { fill: var(--ink); transform-box: fill-box; transform-origin: bottom; animation: growy .6s cubic-bezier(.3,.7,.2,1) both; animation-delay: calc(var(--j) * 14ms); }
.dpchart .eb.part { fill: #8A8A8A; }
.dpchart .eb.hi { fill: #FFA552; }
.dpchart .ehit { fill: transparent; cursor: pointer; }
.dpchart .tick, .rachart .tick { stroke: #DDD9CE; stroke-width: 1; }
.dpchart .hv { font-family: var(--font-display); font-weight: 800; font-size: 13px; }
.dpst .hb0.gone { fill: var(--paper); stroke-dasharray: 4 3; }
@keyframes popin { from { transform: scale(.2); } to { transform: none; } }
@keyframes growy { from { transform: scaleY(0); } to { transform: none; } }
/* Military */
.waffle { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; max-width: 340px; margin-inline: auto; }
.waffle i { aspect-ratio: 1; border: 1.5px solid var(--ink); border-radius: 3px; cursor: pointer; animation: popin .3s both; animation-delay: calc(var(--i) * 8ms); transition: opacity .3s; }

.aidbars { display: grid; gap: 12px; }

.drpick { display: flex; flex-wrap: wrap; gap: 12px 22px; }

.drres ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: 15.5px; }
@media (max-width: 420px) { .ab-row { grid-template-columns: 62px 1fr 74px; } .ab-v { font-size: 17px; } }


/* v10: playthrough fixes */
[hidden] { display: none !important; }

function wireCompare(root) {
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  root.querySelectorAll("[data-cmp]").forEach(st => {
    const rng = st.querySelector(".cmp-range");
    let hintRaf = null, io = null;
    const set = v => { v = Math.max(0, Math.min(100, v)); st.style.setProperty("--pos", v.toFixed(2) + "%"); rng.value = Math.round(v); };
    const stopHint = () => { if (hintRaf) cancelAnimationFrame(hintRaf); hintRaf = null; io && io.disconnect(); };
    const fromX = x => { const r = st.getBoundingClientRect(); set((x - r.left) / r.width * 100); };
    let down = null;
    st.addEventListener("pointerdown", e => {
      stopHint();
      down = { x: e.clientX, y: e.clientY, touch: e.pointerType !== "mouse", moved: false };
      if (!down.touch) { fromX(e.clientX); st.setPointerCapture?.(e.pointerId); }
    });
    st.addEventListener("pointermove", e => {
      if (!down) return;
      if (down.touch && !down.moved && Math.abs(e.clientX - down.x) < 6) return;
      down.moved = true; fromX(e.clientX);
    });
    st.addEventListener("pointerup", e => { if (down && down.touch && !down.moved) fromX(e.clientX); down = null; });
    st.addEventListener("pointercancel", () => { down = null; });
    rng.addEventListener("input", () => { stopHint(); set(+rng.value); });
    if (!reduce && "IntersectionObserver" in window) {
      io = new IntersectionObserver(es => {
        if (!es.some(e => e.isIntersecting)) return;

      }, { threshold: 0.6 });
      io.observe(st);
    }
    CLEAN.push(stopHint);
  });
}

/* ---------- Tile map ---------- */
function mix(a, b, t) {
  const h = s => s.trim().replace("#", "");
  const pa = h(a), pb = h(b);
  const c = i => Math.round(parseInt(pa.substr(i, 2), 16) * (1 - t) + parseInt(pb.substr(i, 2), 16) * t).toString(16).padStart(2, "0");
  return "#" + c(0) + c(2) + c(4);
}
function cssv(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function tileMap(id, cfg) {
  const vals = DATA.states[cfg.key];
  const v = Object.values(vals);
  const lo = cfg.lo ?? Math.min(...v), hi = cfg.hi ?? Math.max(...v);
  const t = x => Math.max(0, Math.min(1, (x - lo) / (hi - lo)));
  const S = 30, G = 3;
  const cLo = cssv("--seq-lo"), cHi = cssv("--seq-hi"), ink = cssv("--ink"), paper = cssv("--surface");
  let rects = "";
  for (const [ab, x, y] of GRID) {
    const val = vals[ab];
    const has = val !== undefined;
    const tt = has ? t(val) : 0;
    const fill = has ? mix(cLo, cHi, tt) : "transparent";
    const txt = tt > .5 ? paper : ink;
    const cast = CAST.includes(ab);
    rects += `<g data-ab="${ab}"><rect x="${x * S + G / 2}" y="${y * S + G / 2}" width="${S - G}" height="${S - G}" rx="4" fill="${fill}" ${has ? `stroke="${ink}" stroke-width="${cast ? 3 : 1.2}"` : `stroke="${ink}" stroke-width="1.2" stroke-dasharray="3 2"`}></rect><text class="lab ${cast ? "cast" : ""}" x="${x * S + S / 2}" y="${y * S + S / 2 + 3.5}" text-anchor="middle" fill="${has ? txt : cssv("--muted")}">${ab}</text></g>`;
  }
  const ref = cfg.ref != null ? `<span class="mark" style="left:${(t(cfg.ref) * 100).toFixed(1)}%"></span>` : "";
  return `<div class="tmap" id="${id}">
    <p class="label" style="margin:0">${cfg.title}</p>
    <svg viewBox="0 0 ${11 * S} ${8 * S}" role="img" aria-label="${cfg.title}">${rects}</svg>
    <div class="legend">
      <div class="ramp" style="background:linear-gradient(90deg, ${cLo}, ${cHi})">${ref}</div>
      <div class="ends"><span>${cfg.f(lo)}</span>${cfg.ref != null ? `<span class="marklab">Denmark ${cfg.f(cfg.ref)}</span>` : ""}<span>${cfg.f(hi)}</span></div>
    </div>
    <p class="readout" aria-live="polite">${cfg.hint || "Tap a state to see its number. Outlined: the six states we follow."}</p>
  </div>`;
}
function wireMap(id, cfg) {
  const el = document.getElementById(id); if (!el) return;
  const out = el.querySelector(".readout");
  const vals = DATA.states[cfg.key];
  el.querySelectorAll("g[data-ab]").forEach(g => {
    const show = () => {
      const ab = g.dataset.ab, val = vals[ab];
      out.innerHTML = val === undefined ? `<strong>${DATA.names[ab]}</strong>: no estimate` : `<strong>${DATA.names[ab]}</strong>: ${cfg.f(val)} ${cfg.unit}`;
      el.querySelectorAll("g[data-ab] rect").forEach(r => r.style.opacity = r.parentNode === g ? 1 : .55);
    };
    g.addEventListener("click", show); g.addEventListener("mouseenter", show);
  });
  el.querySelector("svg").addEventListener("mouseleave", () => el.querySelectorAll("rect").forEach(r => r.style.opacity = 1));
}

function mountGuns() {
  const cv = document.getElementById("gunbox"); if (!cv || !window.Matter) return;
  const M = Matter, W = 400, H = 330, dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = W * dpr; cv.height = H * dpr; const ctx = cv.getContext("2d"); ctx.scale(dpr, dpr);
  const gunPath = new Path2D(PATH.gun.match(/d="([^"]+)"/g).map(x => x.slice(3, -1)).join(" "));
  const colDk = cssv("--dk"), colUs = cssv("--us"), glass = "#F2F0EA", edge = cssv("--ink");
  const box = [{ x0: 14, x1: 190 }, { x0: 210, x1: 386 }], top = 22, floor = H - 8;
  let engine, runner, raf, timers = [];
  const cDk = document.getElementById("cnt-dk"), cUs = document.getElementById("cnt-us");
  function build() {
    if (engine) { M.Runner.stop(runner); M.World.clear(engine.world, false); M.Engine.clear(engine); }
    timers.forEach(clearTimeout); timers = [];
    engine = M.Engine.create(); engine.gravity.y = 1.1; runner = M.Runner.create(); dropSounds(M, engine, "clack");
    const st = { isStatic: true, friction: .8 };
    const walls = [];
    box.forEach(b => {
      walls.push(M.Bodies.rectangle((b.x0 + b.x1) / 2, floor + 10, b.x1 - b.x0 + 20, 20, st));
      walls.push(M.Bodies.rectangle(b.x0 - 5, (top + floor) / 2, 10, floor - top + 40, st));
      walls.push(M.Bodies.rectangle(b.x1 + 5, (top + floor) / 2, 10, floor - top + 40, st));
    });
    M.Composite.add(engine.world, walls);
    let nDk = 0, nUs = 0; cDk.textContent = "0"; cUs.textContent = "0";
    const add = (i, kind) => {
      const b = box[i]; const g = M.Bodies.rectangle(b.x0 + 14 + Math.random() * (b.x1 - b.x0 - 28), -20 - Math.random() * 30, 19, 13,
        { chamfer: { radius: 3 }, friction: .5, frictionAir: .01, restitution: .15, angle: (Math.random() - .5) * 1.6 });
      g.kind = kind; M.Composite.add(engine.world, g);
    };
    const total = 2600; calmDrop(M, engine, cv, total + 1700, timers);
    for (let k = 0; k < 120; k++) timers.push(setTimeout(() => { add(1, "us"); nUs++; cUs.textContent = nUs; if (nUs === 120) cUs.textContent = "120.5"; }, k * total / 120));
    for (let k = 0; k < 10; k++) timers.push(setTimeout(() => { add(0, "dk"); nDk++; cDk.textContent = nDk; if (nDk === 10) cDk.textContent = "9.9"; }, 100 + k * total / 10));
    if (reduceMotion) {
      timers.forEach(clearTimeout); timers = [];
      for (let k = 0; k < 120; k++) add(1, "us"); for (let k = 0; k < 10; k++) add(0, "dk");
      for (let t = 0; t < 600; t++) M.Engine.update(engine, 1000 / 60);
      cDk.textContent = "9.9"; cUs.textContent = "120.5";
    } else M.Runner.run(runner, engine);
    if (matchMedia("(pointer: fine)").matches) {
      const mouse = M.Mouse.create(cv); mouse.pixelRatio = dpr;
      ["mousewheel", "DOMMouseScroll", "wheel"].forEach(ev => cv.removeEventListener(ev, mouse.mousewheel));
      const mc = M.MouseConstraint.create(engine, { mouse, constraint: { stiffness: .2 } });
      M.Composite.add(engine.world, mc);
    }
  }
  function draw() {
    ctx.clearRect(0, 0, W, H);
    box.forEach((b, i) => {
      ctx.fillStyle = glass; ctx.fillRect(b.x0, top, b.x1 - b.x0, floor - top);
      ctx.strokeStyle = edge; ctx.lineWidth = 3; ctx.beginPath();
      ctx.moveTo(b.x0, top); ctx.lineTo(b.x0, floor); ctx.lineTo(b.x1, floor); ctx.lineTo(b.x1, top); ctx.stroke();
    });
    for (const g of M.Composite.allBodies(engine.world)) {
      if (!g.kind) continue;
      ctx.save(); ctx.translate(g.position.x, g.position.y); ctx.rotate(g.angle);
      ctx.scale(19 / 20.8, 19 / 20.8); ctx.translate(-12.2, -13.75);
      ctx.fillStyle = g.kind === "dk" ? colDk : colUs; ctx.fill(gunPath); ctx.restore();
    }
    raf = requestAnimationFrame(draw);
  }
  build(); draw();
  document.getElementById("drop").addEventListener("click", build);
  CLEAN.push(() => { cancelAnimationFrame(raf); timers.forEach(clearTimeout); M.Runner.stop(runner); M.Engine.clear(engine); });
}

function mountHours() {
  const sc = document.getElementById("r-scrub"); if (!sc) return;
  const US = 1789, DK = 1380, dDone = 365 * DK / US;
  const el = id => document.getElementById(id);
  let lastM = -1, wasDone = false;
  const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  function dateOf(d) { const t = new Date(2025, 0, 1); t.setDate(t.getDate() + Math.round(d) - 1); return months[t.getMonth()] + " " + t.getDate(); }
  function set(d) {
    const us = US * d / 365, dk = Math.min(us, DK);
    el("r-date").textContent = d >= 365 ? "December 31" : dateOf(Math.max(1, d));
    el("r-us").textContent = fmt(us); el("r-dk").textContent = fmt(dk);
    el("r-usbar").style.width = (d / 365 * 100) + "%"; el("r-dkbar").style.width = (Math.min(d, dDone) / 365 * 100) + "%";
    el("r-flag").hidden = d < dDone;
    sc.value = Math.round(d);
    const m = Math.min(11, Math.floor(d / 30.42)), dn = d >= dDone;
    if (raf && m !== lastM) SND.play("tick", m / 11);
    if (raf && dn && !wasDone) SND.play("pop");
    lastM = m; wasDone = dn;
  }
  let raf = null, t0 = 0, from = 1;
  const dur = 9000;
  function tick(t) {
    if (!t0) t0 = t;
    const d = Math.min(365, from + (t - t0) / dur * 365);
    set(d);
    if (d < 365) raf = requestAnimationFrame(tick); else { raf = null; el("r-play").textContent = "↺ Play again"; }
  }
  function play() {
    if (raf) { cancelAnimationFrame(raf); raf = null; el("r-play").textContent = "▶ Keep going"; return; }
    from = +sc.value >= 365 ? 0 : +sc.value; t0 = 0; el("r-play").textContent = "❚❚ Pause";
    if (reduceMotion) { set(365); el("r-play").textContent = "↺ Play again"; return; }
    raf = requestAnimationFrame(tick);
  }
  sc.addEventListener("input", () => { if (raf) { cancelAnimationFrame(raf); raf = null; el("r-play").textContent = "▶ Keep going"; } set(+sc.value); });
  el("r-play").addEventListener("click", play);
  set(0);
  CLEAN.push(() => raf && cancelAnimationFrame(raf));
}

}
function mountImm() {
  const sc = document.getElementById("im-scrub"); if (!sc) return;
  const el = id => document.getElementById(id);
  const X = y => 34 + (y - 1850) / (2026 - 1850) * 372;
  const fill = (gid, n, color) => el(gid).querySelectorAll(".pi svg").forEach((s, i) => s.setAttribute("fill", i < n ? color : "var(--paper)"));
  function set(i) {
    const st = IMM_STOPS[i], now = st === "now";
    const us = now ? IMM_US[2024] : IMM_US[st], dk = now ? IMM_DK[2026] : IMM_DK[st];
    el("im-year").textContent = now ? "Today" : st;
    el("im-us").textContent = fmt(us, 1) + "%";
    el("im-dk").textContent = dk == null ? "–" : fmt(dk, 1) + "%";
    fill("im-usg", Math.round(us), "var(--ink)"); fill("im-dkg", dk == null ? 0 : Math.round(dk), "var(--dk)");
    el("im-dkg").style.opacity = dk == null ? .35 : 1;
    const cx = X(now ? 2026 : st); el("im-cur").setAttribute("x1", cx); el("im-cur").setAttribute("x2", cx);
    const note = IMM_NOTES[st] || (dk == null && st > 1850 ? "No comparable Danish figures before 1980." : "");
    el("im-note").textContent = note || " ";
    sc.value = i;
  }
  let timer = null;
  const stop = () => { clearInterval(timer); timer = null; el("im-play").textContent = "▶ Play 175 years"; };
  el("im-play").addEventListener("click", () => {
    if (timer) return stop();
    let i = 0; set(0); el("im-play").textContent = "❚❚ Pause";
    timer = setInterval(() => { i++; if (i >= IMM_STOPS.length) { stop(); el("im-play").textContent = "↺ Play again"; return; } set(i); }, reduceMotion ? 10 : 1100);
  });
  sc.addEventListener("input", () => { if (timer) stop(); set(+sc.value); });
  set(IMM_STOPS.length - 1);
  CLEAN.push(() => clearInterval(timer));
}

function mountLe() {
  const sc = document.getElementById("le-scrub"); if (!sc) return;
  const el = id => document.getElementById(id);
  const noteYears = Object.keys(LE_NOTES).map(Number);
  let shown = 2024;
  function set(y) {
    const d = LE_DK[y], u = LE_US[y], gap = d - u;
    el("le-year").textContent = y; el("le-dk").textContent = fmt(d, 1); el("le-us").textContent = fmt(u, 1);
    el("le-gap").innerHTML = Math.abs(gap) < .15 ? "Dead even" : gap > 0 ? `Danes live <strong>${fmt(gap, 1)} years</strong> longer` : `Americans live <strong>${fmt(-gap, 1)} years</strong> longer`;
    ["cur"].forEach(() => { el("le-cur").setAttribute("x1", LX(y)); el("le-cur").setAttribute("x2", LX(y)); });
    el("le-pdk").setAttribute("cx", LX(y)); el("le-pdk").setAttribute("cy", LY(d));
    el("le-pus").setAttribute("cx", LX(y)); el("le-pus").setAttribute("cy", LY(u));
    const k = noteYears.filter(n => n <= y).pop();
    if (k !== shown) { el("le-note").textContent = LE_NOTES[k]; shown = k; }
    sc.value = y;
  }
  let timer = null;
  const stop = (label = "▶ Play 1960–2024") => { clearTimeout(timer); timer = null; el("le-play").textContent = label; };
  el("le-play").addEventListener("click", () => {
    if (timer) return stop();
    let y = 1960; shown = null; set(y); el("le-play").textContent = "❚❚ Pause";
    const tick = () => { y++; if (y > 2024) return stop("↺ Play again"); set(y); timer = setTimeout(tick, reduceMotion ? 5 : LE_NOTES[y] ? 2200 : 130); };
    timer = setTimeout(tick, reduceMotion ? 5 : 2000);
  });
  sc.addEventListener("input", () => { if (timer) stop(); set(+sc.value); });
  set(2024);
  CLEAN.push(() => clearTimeout(timer));
}

  const rows = HOM.map(([n, v], i) => {
    const y = 10 + i * rowH, us = n === "United States", dk = n === "Denmark";
    return `<g class="hrow ${us ? "us" : dk ? "dk" : ""}" style="--j:${i}">
      <text x="${x0 - 8}" y="${y + 17}" text-anchor="end" class="${us || dk ? "hd" : ""}">${us ? "U.S." : n}</text>
      <rect class="hb0" x="${x0}" y="${y + 3}" width="${v * sc}" height="${rowH - 12}" rx="3"></rect>
      ${us ? `<rect class="hbgun" x="${x0}" y="${y + 3}" width="${v * HOM_GUN * sc}" height="${rowH - 12}" rx="3"></rect><text class="gunlab" x="${x0 + 8}" y="${y + 18}">with a gun</text><text class="gunlab rest" x="${x0 + v * HOM_GUN * sc + 6}" y="${y + 18}">other</text>` : ""}
      <text x="${x0 + v * sc + 6}" y="${y + 17}" class="hv">${fmt(v, 1)}</text></g>`;
  }).join("");
  return `
    <svg class="chart homchart" id="homchart" viewBox="0 0 ${W} ${10 + HOM.length * rowH + 6}" role="img" aria-label="Bar chart: homicides per 100,000 people in 2023 in eight rich countries">${rows}</svg>
    <div class="stage-foot"><button class="chipbtn" id="hom-gun" aria-pressed="false">Show killings with a gun in the U.S.</button></div>
    <p class="note-pop" id="hom-out" aria-live="polite">People killed by another person, per 100,000 people, 2023.</p>`;
}
function mountHom() {
  const b = document.getElementById("hom-gun"); if (!b) return;
  const ch = document.getElementById("homchart"), out = document.getElementById("hom-out");
  b.addEventListener("click", () => {
    const on = !ch.classList.contains("gun"); ch.classList.toggle("gun", on); b.setAttribute("aria-pressed", on);
    b.textContent = on ? "Hide killings with a gun" : "Show killings with a gun in the U.S.";
    out.innerHTML = on ? `In the U.S., <strong>3 in 4</strong> killings are done with a gun (2024). The rest alone, without guns, is still above Denmark’s total.` : "People killed by another person, per 100,000 people, 2023.";
  });
}

function paintViz(id, shape, read, aria) {
  const cell = shape === "sq" ? "<i></i>" : personSvg("var(--paper)");
  return `
    <div class="paintwrap nosw"><div class="ppl paint ${shape === "sq" ? "sqs" : ""}" id="${id}" role="slider" tabindex="0" aria-label="${aria}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">${Array.from({ length: 100 }, (_, i) => `<span class="pi" style="--x:${i % 10};--y:${Math.floor(i / 10)}">${cell}</span>`).join("")}</div></div>
    <div class="stage-foot"><button class="primary" id="${id}-go" disabled>Show me</button><span class="sub" id="${id}-read">${read}</span></div>`;
}
function mountPaint(id, label, done) {
  const grid = document.getElementById(id); if (!grid) return;
  const items = [...grid.children], go = document.getElementById(id + "-go"), rd = document.getElementById(id + "-read");
  let n = 0, down = false;
  const set = k => {
    const nn = Math.max(0, Math.min(100, k)); if (nn !== n) SND.play("tick", nn / 100);
    n = nn;
    items.forEach((it, i) => it.classList.toggle("on", i < n));
    grid.setAttribute("aria-valuenow", n);
    rd.innerHTML = label(n); go.disabled = false;
  };
  const at = e => {
    const r = grid.getBoundingClientRect();
    const col = Math.max(0, Math.min(9, Math.floor((e.clientX - r.left) / r.width * 10)));
    const row = Math.floor((e.clientY - r.top) / r.height * 10);
    return row < 0 ? 0 : row > 9 ? 100 : row * 10 + col + 1;
  };
  grid.addEventListener("pointerdown", e => { e.preventDefault(); down = true; grid.setPointerCapture(e.pointerId); const k = at(e); set(k === 1 && n === 1 ? 0 : k); });
  grid.addEventListener("pointermove", e => { if (down) set(at(e)); });
  const reveal = () => { const r = go.getBoundingClientRect(), nav = document.querySelector(".nav"), lim = innerHeight - (nav ? nav.offsetHeight : 0) - 16; if (r.bottom > lim) window.scrollBy({ top: r.bottom - lim, behavior: reduceMotion ? "auto" : "smooth" }); };
  ["pointerup", "pointercancel"].forEach(t => grid.addEventListener(t, () => { if (down) reveal(); down = false; }));
  grid.addEventListener("keydown", e => { const d = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1, PageUp: 10, PageDown: -10 }[e.key]; if (d) { e.preventDefault(); set(n + d); } });
  go.addEventListener("click", () => done(n));
}

function hemiPos(n, rows) {
  const R0 = .45, radii = Array.from({ length: rows }, (_, i) => R0 + (1 - R0) * i / (rows - 1));
  const sum = radii.reduce((a, b) => a + b, 0);
  const counts = radii.map(r => Math.floor(n * r / sum));
  let rest = n - counts.reduce((a, b) => a + b, 0);
  for (let i = rows - 1; rest > 0; i = (i - 1 + rows) % rows, rest--) counts[i]++;
  const pts = [];
  radii.forEach((r, i) => { const c = counts[i]; for (let j = 0; j < c; j++) { const a = Math.PI * (1 - j / (c - 1)); pts.push({ x: r * Math.cos(a), y: r * Math.sin(a), a, r }); } });
  return pts.sort((p, q) => q.a - p.a || p.r - q.r);
}

  const $ = id => document.getElementById(id);
  let cur = "dk", sel = new Set();
  const draw = () => {
    const H = HC[cur], pts = hemiPos(H.total, H.rows), rad = cur === "dk" ? 6.6 : 4.3;
    let k = 0, dots = "";
    H.parties.forEach((p, pi) => { for (let i = 0; i < p.s; i++, k++) { const q = pts[k]; dots += `<circle data-p="${pi}" cx="${(q.x * 198).toFixed(1)}" cy="${(-q.y * 198).toFixed(1)}" r="${rad}" fill="${p.c}" style="--d:${k}"></circle>`; } });
    svg.innerHTML = dots;
    svg.onclick = e => { const c = e.target.closest("circle"); if (!c) return; const i = +c.dataset.p; sel.has(i) ? sel.delete(i) : sel.add(i); update(); };
    $("hc-ptys").innerHTML = H.parties.map((p, i) => `<button class="pty" data-p="${i}" aria-pressed="false"><span class="sw" style="background:${p.c}"></span>${p.k ? `<b>${p.k}</b>` : ""}<span class="pn">${p.n}</span><span class="n num">${p.s}</span></button>`).join("");
    $("hc-ptys").querySelectorAll(".pty").forEach(b => b.addEventListener("click", () => { const i = +b.dataset.p; sel.has(i) ? sel.delete(i) : sel.add(i); update(); }));
    $("hc-meter").querySelector(".mk").style.left = (H.maj / H.total * 100) + "%";
    $("hc-gov").textContent = H.govBtn; $("hc-cap").textContent = H.cap; $("hc-of").textContent = `of ${H.total} seats`;
    update(true);
  };
  const update = (fresh, gov) => {
    const H = HC[cur], n = [...sel].reduce((a, i) => a + H.parties[i].s, 0);
    $("hc-sel").textContent = n;
    $("hc-meter").querySelector(".fill").style.width = (n / H.total * 100) + "%";
    $("hc-meter").classList.toggle("ok", n >= H.maj);
    svg.querySelectorAll("circle").forEach(c => c.classList.toggle("dim", sel.size > 0 && !sel.has(+c.dataset.p)));
    $("hc-ptys").querySelectorAll(".pty").forEach(b => b.setAttribute("aria-pressed", sel.has(+b.dataset.p)));
    const out = $("hc-out");
    if (gov) out.innerHTML = H.govTxt;
    else if (!sel.size) out.innerHTML = H.intro;
    else if (n >= H.maj) out.innerHTML = `<strong>Majority!</strong> ${n} seats with ${sel.size === 1 ? "one party" : `${sel.size} parties`}.${cur === "dk" && sel.size > 1 ? " In Denmark, this kind of deal is made after almost every election." : ""}`;
    else out.innerHTML = `${n} seats. You need <strong>${H.maj - n}</strong> more.`;
  };
  app.querySelectorAll("[data-hc]").forEach(b => b.addEventListener("click", () => {
    if (b.dataset.hc === cur) return; cur = b.dataset.hc; sel = new Set();
    app.querySelectorAll("[data-hc]").forEach(x => x.setAttribute("aria-pressed", x === b)); draw();
  }));
  $("hc-gov").addEventListener("click", () => { sel = new Set(HC[cur].gov); update(false, true); });
  $("hc-clr").addEventListener("click", () => { sel = new Set(); update(); });
  draw();
}

/* --- Card 4: abortion, one national rule splits into state rules --- */
const AB_ROWS = [[0, "Banned"], [6, "6 weeks"], [12, "12 weeks"], [18, "18 weeks"], [22, "22 weeks"], [24, "About 24 weeks"], [40, "No limit"]];
const abMembers = w => Object.keys(DATA.states.abort).filter(k => DATA.states.abort[k] === w).sort((a, b) => DATA.names[a].localeCompare(DATA.names[b]));
const abCount = m => { const n = m.filter(k => k !== "DC").length; return `${n} state${n === 1 ? "" : "s"}${m.includes("DC") ? " + D.C." : ""}`; };
const andList = a => a.length < 2 ? a.join("") : a.slice(0, -1).join(", ") + (a.length > 2 ? "," : "") + " and " + a[a.length - 1];
const AB = { x0: 116, xw: 7, rt: 96, rp: 26, bh: 17 };
function abortViz() {
  const { x0, xw, rt, rp } = AB, W = x0 + 40 * xw + 6, n = AB_ROWS.length, yb = rt + n * rp, X = w => x0 + w * xw;
  const ticks = [0, 6, 12, 18, 24, 30, 36].map(w => `<line x1="${X(w)}" x2="${X(w)}" y1="22" y2="${yb}" class="tick"></line><text x="${X(w)}" y="14" text-anchor="middle" class="axl">${w}</text>`).join("");
  const bars = AB_ROWS.map((r, i) => `<rect class="ab" data-i="${i}" x="${x0}" y="${rt + i * rp - .5}" width="${40 * xw}" height="${rp + 1}" style="transform:scale(${24 / 40},1)"></rect>`).join("");
  const labs = AB_ROWS.map(([w, lab], i) => {
    const cy = rt + i * rp + rp / 2 + 5, inside = w >= 36;
    return `<text class="rl" data-i="${i}" x="${x0 - 10}" y="${cy}" text-anchor="end">${lab}</text><text class="cnt${inside ? " in" : ""}" data-i="${i}" x="${inside ? X(w) - 8 : X(w) + 8}" y="${cy}" text-anchor="${inside ? "end" : "start"}">${abCount(abMembers(w))}</text>`;
  }).join("");
  const hits = AB_ROWS.map((r, i) => `<rect class="abrow" data-i="${i}" x="0" y="${rt + i * rp}" width="${W}" height="${rp}"></rect>`).join("");
  const my = rt + n * rp / 2;
  return `
    <div class="seg" role="group" aria-label="Period"><button data-ab-m="roe" aria-pressed="true">1973 to 2022</button><button data-ab-m="now" aria-pressed="false">Today</button></div>
    <p class="sub abcap">How many weeks into a pregnancy abortion is allowed on request</p>
    <svg class="chart abchart" id="abchart" viewBox="0 0 ${W} ${yb + 26}" role="img" aria-label="Weeks of pregnancy until which abortion is allowed: Denmark, and U.S. states grouped by their rule">
      ${ticks}
      <text x="${x0 - 10}" y="46" text-anchor="end" class="hd">Denmark</text>
      <rect x="${x0}" y="30" width="${40 * xw}" height="20" rx="3" class="dkbar" id="ab-dk" style="transform:scaleX(${12 / 40})"></rect>
      <text x="${x0 - 10}" y="${rt - 10}" text-anchor="end" class="hd">U.S.</text>
      <g>${bars}</g>
      <text class="roe-in" text-anchor="end"><tspan class="b" x="${x0 - 10}" y="${my - 14}">One rule:</tspan><tspan x="${x0 - 10}" dy="19">no ban before</tspan><tspan x="${x0 - 10}" dy="19">about 24 weeks</tspan></text>
      <g id="ab-dkline" class="dkline" style="transform:translateX(${12 * xw}px)"><line x1="${x0}" x2="${x0}" y1="50" y2="${yb + 3}"></line><text class="dkv" id="ab-dkv" x="${x0 + 8}" y="46">12 weeks</text><text x="${x0}" y="${yb + 20}" text-anchor="middle">Denmark’s limit</text></g>
      <g>${labs}</g><g>${hits}</g>
    </svg>
    <p class="note-pop" id="ab-out" aria-live="polite"></p>`;
}
function mountAbort() {
  const ch = document.getElementById("abchart"); if (!ch) return;
  const out = document.getElementById("ab-out"), rows = [...ch.querySelectorAll(".abrow")];
  const TXT = {
    roe: "From 1973 to 2022, <em>Roe v. Wade</em> set one rule for the whole U.S.: no state could ban abortion before the fetus could survive outside the womb, at about 24 weeks. Some states allowed it even later. Denmark allowed abortion on request up to 12 weeks.",
    now: "Since 2022, each state decides. <strong>13 states</strong> ban almost all abortions, and 6 more stop at 6 or 12 weeks. But many states allow abortion later than Denmark, which moved its limit to 18 weeks in 2025. Tap a row to see the states."
  };
  let mode = "roe";
  const pick = g => { ch.querySelectorAll("[data-i]").forEach(r => r.classList.toggle("hi", !!g && r.dataset.i === g.dataset.i)); ch.classList.toggle("sel", !!g); };
  const set = m => {
    mode = m; const now = m === "now"; pick(null);
    ch.classList.toggle("now", now);
    ch.querySelectorAll(".ab").forEach(g => { const w = AB_ROWS[+g.dataset.i][0]; g.style.transform = now ? `scale(${w / 40},${AB.bh / (AB.rp + 1)})` : `scale(${24 / 40},1)`; });
    document.getElementById("ab-dk").style.transform = `scaleX(${(now ? 18 : 12) / 40})`;
    document.getElementById("ab-dkline").style.transform = `translateX(${(now ? 18 : 12) * AB.xw}px)`;
    document.getElementById("ab-dkv").textContent = now ? "18 weeks" : "12 weeks";
    out.innerHTML = TXT[m];
    app.querySelectorAll("[data-ab-m]").forEach(b => b.setAttribute("aria-pressed", b.dataset.abM === m));
  };
  app.querySelectorAll("[data-ab-m]").forEach(b => b.addEventListener("click", () => set(b.dataset.abM)));
  rows.forEach(g => {
    const w = AB_ROWS[+g.dataset.i][0], m = abMembers(w);
    const rule = w === 0 ? "Banned, with narrow exceptions" : w >= 40 ? "No limit in weeks" : w === 24 ? "Until the fetus could survive outside the womb, about 24 weeks (in Virginia, until the third trimester)" : `Up to ${w} weeks`;
    const show = () => { if (mode !== "now") return; pick(g); out.innerHTML = `<strong>${rule}</strong> (${abCount(m)}): ${andList(m.map(k => DATA.names[k]))}.`; };
    g.addEventListener("click", show); g.addEventListener("mouseenter", show);
  });
  set("roe");
}

function mountDeath() {

  };

const SND = (() => {

    pop: () => { tone(587, 0, .1, "sine", .34, 1175); tone(1760, .07, .16, "sine", .1); tone(2349, .11, .14, "sine", .06); },
    right: () => { tone(784, 0, .2, "sine", .3); tone(1175, .085, .38, "sine", .3); tone(392, .085, .3, "triangle", .06); },
    wrong: () => { tone(233, 0, .18, "triangle", .3, 175); tone(175, .1, .2, "sine", .16, 147); },
    tick: x => tone(420 + 900 * (x || 0), 0, .025, "triangle", .07),

/* drop cards: one clack or clink per hard landing, louder for harder hits */
function dropSounds(M, engine, kind) {
  M.Events.on(engine, "collisionStart", ev => {
    for (const pr of ev.pairs) {
      const a = pr.bodyA, b = pr.bodyB; if (!a.kind && !b.kind) continue;
      const sp = Math.hypot(a.velocity.x - b.velocity.x, a.velocity.y - b.velocity.y);
      if (sp > (engine.quiet ? 4 : 1.6)) { SND.play(kind, Math.min(1, sp / 9)); break; }
    }
  });
}
// once a drop has landed, put resting bodies to sleep so the pile stops shivering (and clacking);
// pressing on the canvas wakes everything so nothing is left floating when a body is dragged away
function calmDrop(M, engine, cv, after, timers) {
  engine.enableSleeping = true; engine.positionIterations = 10; engine.velocityIterations = 8;
  let hold = 0;
  const loose = () => M.Composite.allBodies(engine.world).filter(b => !b.isStatic);
  const nap = () => { if (performance.now() < hold) return; for (const b of loose()) if (!b.isSleeping && b.speed < .6 && b.angularSpeed < .03) M.Sleeping.set(b, true); };
  const rel = () => { if (hold === Infinity) hold = performance.now() + 1500; };
  cv.onmousedown = () => { hold = Infinity; loose().forEach(b => M.Sleeping.set(b, false)); };
  cv.onmouseup = rel; cv.onmouseleave = rel;

}

/* Chart text never renders under 11 px: SVG text shrinks with the chart on phones, so enlarge it in chart units,

const MIN_CHART_PX = 11;
function fitChartText() {

    const ctm = svg.getScreenCTM(); if (!ctm || !ctm.a) return;

    const short = texts.filter(t => t.textContent.trim().length <= 7 && !t.closest("[aria-hidden=true] text, .abrow") && getComputedStyle(t).display !== "none");
    const boxes = short.map(t => { try { return { t, b: t.getBBox() }; } catch (e) { return null; } }).filter(x => x && x.b.width);

      const groups = {};

      Object.values(groups).filter(g => g.length >= 4).forEach(g => {
        g.sort((p, q) => start(p.b) - start(q.b));
        const hit = g.some((x, i) => i && start(x.b) < end(g[i - 1].b) + 2);
        if (hit) g.forEach((x, i) => { if (i % 2) x.t.classList.add("tk-off"); });
      });
    };
    thin(b => b.y + b.height / 2, b => b.x, b => b.x + b.width);   // rows (x-axis ticks)
    thin((b, a) => a === "end" ? b.x + b.width : a === "middle" ? b.x + b.width / 2 : b.x, b => b.y, b => b.y + b.height);  // columns (y-axis ticks, pyramid ages)

    const vb = svg.viewBox.baseVal;
    if (vb && vb.width) svg.querySelectorAll("text, tspan[x]").forEach(t => {
      if (t.dataset.fitdx != null) { if (t.dataset.fitdx === "") t.removeAttribute("dx"); else t.setAttribute("dx", t.dataset.fitdx); delete t.dataset.fitdx; }
