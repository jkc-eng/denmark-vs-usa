      <button class="navbtn next" data-next>${skip ? `Skip<span class="sk-w"> guess</span>` : i === n - 1 ? "Finish" : "Next →"}</button>`}
    </div></nav></div>`;
  wireDeck();
  try { history.replaceState(history.state, "", "#" + state.theme + (state.idx ? "/" + state.idx : "")); } catch (e) {}
  saveSess();
  focusQ();
}
let focusOK = false;  // not on the very first render, so a page load doesn't jump focus
function focusQ() { const h = app.querySelector("main h2.q"); if (h && focusOK) { h.setAttribute("tabindex", "-1"); h.focus({ preventScroll: true }); } focusOK = true; }

function cardHTML(c) {
  const needGuess = c.guess && !state.revealed[c.id];
  const dirCls = state.dir < 0 ? "from-left" : "";
  if (needGuess) {
    const g = { ...c.guess, q: c.guess.q.replace(/^Guess first:\s*(.)/, (m, ch) => ch.toUpperCase()) };
    const gh = `<header class="qhead"><span class="kicker">Guess first</span><h2 class="q">${g.q}</h2></header>`;
    if (g.type === "custom") {
      return `<article class="card ${dirCls}">
      ${gh}
      ${g.hint ? `<p class="context">${g.hint}</p>` : ""}
      <div class="viz guess stage">${g.viz()}</div>
      ${photoFig(c.guessPhoto)}
    </article>`;
    }
    if (g.type === "choice") {
      return `<article class="card ${dirCls}">
      ${gh}
      <div class="viz guess"><div class="opts">${g.opts.map((o, i) => `<button class="opt" data-pick="${i}"><span>${o}</span><span aria-hidden="true">→</span></button>`).join("")}</div></div>
      ${g.hint ? `<p class="context">${g.hint}</p>` : ""}
      ${photoFig(c.guessPhoto)}
    </article>`;
    }
    const val = state.guesses[c.id] ?? g.start;
    return `<article class="card ${dirCls}">
      ${gh}
      <div class="viz guess">
        <output id="gout" class="num" for="guess-${c.id}">${val}</output>
        <input type="range" id="guess-${c.id}" min="${g.min}" max="${g.max}" step="${g.step || 1}" value="${val}" aria-label="Your guess">
        <div class="scale"><span>${g.min}</span><span>${g.max}</span></div>
        <button class="primary" data-reveal>Reveal the answer</button>
      </div>
      ${g.hint ? `<p class="context">${g.hint}</p>` : ""}
      ${photoFig(c.guessPhoto)}
    </article>`;
  }
  let yg = "";
  if (c.guess && state.guesses[c.id] != null) {
    const g = c.guess, v = state.guesses[c.id];
    yg = g.type === "custom" ? (g.yours ? `<p class="yourguess">${g.yours(v)}</p>` : "") : g.type === "choice"
      ? `<p class="yourguess">You guessed <strong>${g.opts[v]}</strong>. ${v === g.answer ? "Correct." : `The answer: <strong>${g.opts[g.answer]}</strong>.`}</p>`
      : `<p class="yourguess">You guessed <strong>${v}</strong>. The answer is <strong>${fmt(g.answer, g.dec ?? 1)}</strong> ${g.unit}.</p>`;
  }
  return `<article class="card full ${dirCls}">
    <header class="qhead"><h2 class="q">${c.q}</h2></header>
    <div class="cbody">
    <div class="viz ${c.stage ? "stage" : "anim"}">${c.viz()}</div>
    <div class="cside">
    ${yg}
    <p class="answer">${c.answer}</p>
    <p class="context">${c.context}</p>
    ${compareFig(c.compare)}${hasClip(c) ? clipFig(c.clip) : photoFig(c.photo)}${listenFig(c.listen)}
    <div class="actions">
      ${c.map ? `<button class="chipbtn" data-toggle="states" aria-expanded="false" aria-controls="p-states">Compare the states</button>` : ""}
      <button class="chipbtn" data-toggle="src" aria-expanded="false" aria-controls="p-src"><span class="i">i</span> Sources</button>
    </div>
    ${c.map ? `<div class="panel" id="p-states" hidden>${tileMap("map-" + c.id, c.map)}${c.statesPhoto ? `<div style="margin-top:14px">${photoFig(c.statesPhoto, "flat")}</div>` : ""}<p class="note">${STATE_INTRO}</p>${c.note ? `<p class="note">${c.note}</p>` : ""}</div>` : ""}
    <div class="panel" id="p-src" hidden><ul>${c.src.map(k => `<li><a href="${SRC[k].u}" target="_blank" rel="noopener">${SRC[k].t}</a></li>`).join("")}${photoKeys(c).map(k => `<li>${CREDITS[k].t}. ${credLine(k)}</li>`).join("")}${hasClip(c) ? `<li>${c.clip.credit}</li>` : ""}${c.listen && listenFig(c.listen) ? `<li>${c.listen.credit}</li>` : ""}</ul>
      <p class="note">Checked ${CHECKED}.${!c.map && c.note ? " " + c.note : ""}</p></div>
    </div></div>
  </article>`;
}

function endCard(theme, justNow) {
  const ready = THEMES.filter(t => t.ready), k = ready.indexOf(theme);
  const nDone = ready.filter(t => DONE.has(t.id)).length, all = nDone === ready.length, nw = justNow && !reduceMotion ? " new go" : "";
  const next = ready.slice(k + 1).concat(ready.slice(0, k)).find(t => !DONE.has(t.id));
  const rows = CARDS[theme.id].map((c, i) => [c, i]).filter(([c]) => RECAP[c.id]);
  return `<article class="card endcard">
    <header class="qhead endhead">
      <span class="seal${nw}" aria-hidden="true">${sealSVG("end")}</span>
      <div class="xp"><span class="xp-segs" aria-hidden="true">${ready.map(t => `<i class="${DONE.has(t.id) ? "on" : ""}${t === theme ? nw : ""}"></i>`).join("")}</span><span class="xp-t">${all ? `All ${ready.length} themes explored` : `Theme explored · ${nDone} of ${ready.length}`}</span></div>
      <h2 class="q">${theme.name}, in short</h2></header>
    <div class="recap">
      <div class="rc rc-h" aria-hidden="true"><span class="rc-l"></span><span class="rc-v dk">Denmark</span><span class="rc-v">U.S.</span></div>
      ${rows.map(([c, i]) => { const [l, d, u] = RECAP[c.id]; return `<button class="rc" data-pip="${i}" aria-label="${l}: Denmark ${d}, U.S. ${u}. Open the card."><span class="rc-l">${l}</span><span class="rc-v dk">${d}</span><span class="rc-v">${u}</span></button>`; }).join("")}
    </div>
    <p class="context">Tap a row to open its card again.</p>
    <div class="actions">${next ? `<button class="primary" data-go="${next.id}">Next: ${next.name}&nbsp;→</button><button class="chipbtn" data-go="quiz">Take the quiz</button>` : `<button class="primary" data-go="quiz">Take the quiz&nbsp;→</button><button class="chipbtn" data-home>All themes</button>`}</div>
  </article>`;
}

function wireDeck() {
  app.querySelectorAll("[data-home]").forEach(b => b.addEventListener("click", () => go("home")));
  app.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => go(b.dataset.go)));
  app.querySelector("[data-prev]")?.addEventListener("click", () => step(-1));
  app.querySelector("[data-next]")?.addEventListener("click", () => step(1));
  app.querySelectorAll("[data-pip]").forEach(b => b.addEventListener("click", () => { SND.play(b.classList.contains("rc") ? "flip" : "swipe"); const k = +b.dataset.pip; state.dir = k >= state.idx ? 1 : -1; state.idx = k; route(); if (b.classList.contains("rc")) window.scrollTo({ top: 0 }); }));
  const c = CARDS[state.theme][state.idx];
  prefetchPhotos(c); prefetchPhotos(CARDS[state.theme][state.idx + 1]);
  wireCompare(app); wireMedia(app);
  if (c && c.mount && !(c.guess && !state.revealed[c.id])) c.mount();
  if (c && c.guess && c.guess.type === "custom" && !state.revealed[c.id]) c.guess.mount(v => { SND.play("reveal"); state.guesses[c.id] = v; state.revealed[c.id] = true; state.dir = 1; deck(); window.scrollTo({ top: 0 }); });
  app.querySelectorAll("[data-pick]").forEach(b => b.addEventListener("click", () => { SND.play(+b.dataset.pick === c.guess.answer ? "right" : "wrong"); state.guesses[c.id] = +b.dataset.pick; state.revealed[c.id] = true; state.dir = 1; deck(); window.scrollTo({ top: 0 }); }));
  const r = app.querySelector('.guess input[type=range]');
  if (r) {
    const out = app.querySelector("#gout");
    r.addEventListener("input", () => { out.textContent = r.value; state.guesses[c.id] = +r.value; });
    app.querySelector("[data-reveal]").addEventListener("click", () => { SND.play("reveal"); state.guesses[c.id] = +r.value; state.revealed[c.id] = true; state.dir = 1; deck(); });
  }
  app.querySelectorAll("[data-toggle]").forEach(b => b.addEventListener("click", () => {
    const p = document.getElementById("p-" + b.dataset.toggle);
    const open = p.hidden; p.hidden = !open; b.setAttribute("aria-expanded", open);
    if (open && b.dataset.toggle === "states") wireMap("map-" + c.id, c.map);
  }));
  // swipe
  const st = app.querySelector(".deckmain");
  let x0 = null, y0 = null;
  st.addEventListener("pointerdown", e => { if (e.target.closest("input,button,a,svg g,.cmp-stage,.nosw")) return; x0 = e.clientX; y0 = e.clientY; });
  st.addEventListener("pointerup", e => {
    if (x0 == null) return; const dx = e.clientX - x0, dy = e.clientY - y0; x0 = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) step(dx < 0 ? 1 : -1);
  });
}

function step(d) {
  const n = CARDS[state.theme].length;
  const cur = CARDS[state.theme][state.idx];
  if (d > 0 && cur && cur.guess && !state.revealed[cur.id]) {
    SND.play("soft"); delete state.guesses[cur.id]; state.revealed[cur.id] = true; state.dir = 1; deck(); window.scrollTo({ top: 0 }); return;
  }
  const ni = state.idx + d;
  if (ni < 0 || ni > n) return;
  SND.play(ni === n ? (DONE.has(state.theme) ? "swipe" : "done") : "swipe");
  state.dir = d; state.idx = ni; route();
  window.scrollTo({ top: 0 });
}

/* ---------- Quiz ---------- */
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function quizPool() { const ok = new Set(THEMES.filter(t => t.ready).map(t => t.id)); return QUIZ.map((q, i) => i).filter(i => ok.has(QUIZ[i].card[0])); }
function quizLen() { return Math.min(10, quizPool().length); }
// spread questions across themes: shuffle within each theme, then deal round-robin
function dealByTheme(list) {
  const by = {}; shuffle(list).forEach(i => (by[QUIZ[i].card[0]] ||= []).push(i));
  const out = [], keys = shuffle(Object.keys(by)); let more = true;
  while (more) { more = false; keys.forEach(k => { const x = by[k].shift(); if (x != null) { out.push(x); more = true; } }); }
  return out;
}
function startQuiz() {
  // questions missed last time come back first, then ones not yet seen, then ones already answered correctly
  const pool = quizPool(), h = i => QH[qKey(i)];
  const pick = [...dealByTheme(pool.filter(i => h(i) === 0)), ...dealByTheme(pool.filter(i => h(i) == null)), ...dealByTheme(pool.filter(i => h(i) === 1))].slice(0, quizLen());
  state.quiz = { order: dealByTheme(pick), k: 0, score: 0, picked: null };
}
function quiz() {
  cleanup();
  document.title = "Quiz · Denmark vs. the U.S.";
  if (!state.quiz) startQuiz();
  const Q = state.quiz, n = Q.order.length;
  if (Q.k >= n) return quizEnd();
  const item = QUIZ[Q.order[Q.k]];
  const done = Q.picked != null;
  app.innerHTML = `<div class="page dark" style="--theme:var(--ink)">` + bar("Test yourself", `${Q.k + 1} / ${n}`, ((Q.k + (done ? 1 : 0)) / n) * 100) + `
  <main class="deckmain wrap"><article class="card">
    <header class="qhead"><h2 class="q">${item.q}</h2></header>
    <div class="opts">${item.opts.map((o, i) => {
      let cls = ""; if (done) { if (i === item.a) cls = "right"; else if (i === Q.picked) cls = "wrong"; }
      return `<button class="opt ${cls}" data-opt="${i}" ${done ? "disabled" : ""}><span>${o}</span><span aria-hidden="true">${done && i === item.a ? "✓" : done && i === Q.picked ? "✗" : ""}</span></button>`;
    }).join("")}</div>
    ${done ? `<div class="feedback" aria-live="polite">
      <p class="verdict ${Q.picked === item.a ? "ok" : "no"}">${Q.picked === item.a ? "Correct." : "Incorrect."}</p>
      <p class="qscore">${Q.score} of ${Q.k + 1} correct so far</p>
      <p class="context" style="color:var(--ink)">${item.why}</p>
      <div class="actions"><button class="primary" data-qnext>${Q.k === n - 1 ? "See your score" : "Next question →"}</button>
      <button class="chipbtn" data-card="${item.card.join(",")}">Open the card</button></div></div>` : ""}
  </article></main></div>`;
  app.querySelectorAll("[data-home]").forEach(b => b.addEventListener("click", () => go("home")));
  app.querySelectorAll("[data-opt]").forEach(b => b.addEventListener("click", () => { Q.picked = +b.dataset.opt; SND.play(Q.picked === item.a ? "right" : "wrong"); if (Q.picked === item.a) Q.score++; (Q.log ||= []).push([Q.order[Q.k], Q.picked]); QH[qKey(Q.order[Q.k])] = Q.picked === item.a ? 1 : 0; saveQH(); quiz(); }));
  app.querySelector("[data-qnext]")?.addEventListener("click", () => { if (Q.k + 1 >= n) SND.play(Q.score === n ? "perfect" : Q.score >= n * .6 ? "win" : "soft"); Q.k++; Q.picked = null; quiz(); window.scrollTo({ top: 0 }); });
  app.querySelector("[data-card]")?.addEventListener("click", e => { const [t, i] = e.currentTarget.dataset.card.split(","); state.theme = t; state.idx = +i; state.revealed[CARDS[t][+i].id] = true; location.hash = t; route(); });
  if (!done) focusQ(); else app.querySelector("[data-qnext]")?.focus({ preventScroll: true });
}
function quizEnd() {
  const Q = state.quiz, n = Q.order.length;
  try { const prev = localStorage.getItem("dkus-best2"), pb = prev ? +prev.split("/")[0] / +prev.split("/")[1] : -1; if (Q.score / n >= pb) { best = `${Q.score}/${n}`; localStorage.setItem("dkus-best2", best); } } catch (e) {}
  app.innerHTML = `<div class="page dark" style="--theme:var(--ink)">` + bar("Test yourself", "Done", 100) + `
  <main class="deckmain wrap"><article class="card endcard">
    <header class="qhead"><span class="label">Your score</span><p class="score num" style="margin:0">${Q.score}<span style="font-size:.4em">/${n}</span></p></header>
    <p class="answer">${(() => { const N = quizPool().length, m = quizKnown(); return m >= N ? `You have now answered all ${N} questions correctly.` : `You have now answered ${m} of the ${N} questions correctly. The next round brings back the ones you missed.`; })()}</p>
    <div class="qcover" role="img" aria-label="${quizKnown()} of ${quizPool().length} questions answered correctly">${quizPool().map(i => `<i class="${QH[qKey(i)] === 1 ? "on" : QH[qKey(i)] === 0 ? "miss" : ""}"></i>`).join("")}</div>
    <p class="qcover-cap" aria-hidden="true">One dot per question. Black: correct. <b>Red: missed last time.</b> Empty: not asked yet.</p>
    <div class="actions"><button class="primary" data-again>Try again</button><button class="chipbtn" data-home>All themes</button></div>
    <p class="label" style="margin:8px 0 0">Your answers</p>
    <ol class="review">${(Q.log || []).map(([qi, pk]) => { const it = QUIZ[qi], ok = pk === it.a; return `<li class="${ok ? "ok" : "no"}"><span class="rq"><span class="mk" aria-label="${ok ? "Correct" : "Incorrect"}">${ok ? "✓" : "✗"}</span>${it.q}</span><span class="ra">${ok ? "" : `Your answer: ${it.opts[pk].replace(/\.$/, "")}. `}${ok ? "Answer" : "Correct answer"}: <strong>${it.opts[it.a].replace(/\.$/, "")}</strong></span>${ok ? "" : `<span class="rw">${it.why}</span>`}${ok ? "" : `<button class="linkbtn" data-card="${it.card.join(",")}">Open the card →</button>`}</li>`; }).join("")}</ol>
  </article></main></div>`;
  app.querySelectorAll("[data-home]").forEach(b => b.addEventListener("click", () => go("home")));
  app.querySelector("[data-again]").addEventListener("click", () => { startQuiz(); quiz(); window.scrollTo({ top: 0 }); });
  app.querySelectorAll("[data-card]").forEach(b => b.addEventListener("click", e => { const [t, i] = e.currentTarget.dataset.card.split(","); state.theme = t; state.idx = +i; state.revealed[CARDS[t][+i].id] = true; location.hash = t; route(); window.scrollTo({ top: 0 }); }));
}


/* ---------- Sound wiring ---------- */
["pointerdown", "touchstart", "keydown", "pointerup", "touchend"].forEach(ev => document.addEventListener(ev, () => SND.warm(), { capture: true, passive: true }));
document.addEventListener("visibilitychange", () => { if (document.hidden) SND.sleep(); else SND.warm(); });
(window.requestIdleCallback || (f => setTimeout(f, 300)))(() => SND.preinit(), { timeout: 1500 });
const EXPLICIT = "[data-next],[data-prev],[data-pip],[data-pick],[data-reveal],[data-opt],[data-qnext],[data-reset-yes],.snd,.guess .primary";
const uiSnd = (e, early) => {
  if (e.target.closest(".snd")) return;
  const el = e.target.closest("button, .tmap rect, .swarm circle, .scatter .hs, .ladder .hit, .pyr .hitrow, .hemi circle, .dpchart .ehit, .abchart .abrow, .waffle i, .szmap path"); if (!el || el.disabled) return;
  if (early) el.__snd = performance.now(); else if (el.__snd && performance.now() - el.__snd < 1500) { el.__snd = 0; return; }
  if (el.matches(EXPLICIT)) return;
  if (el.matches(".tile")) return SND.play("flip");
  if (el.matches(".chip, .seg button, .pty, .chipbtn[aria-pressed]")) return SND.play("toggle");
  if (el.matches(".ghostbtn, .primary, .tbtn, .clip-go")) return el.matches(".tbtn, .clip-go") ? null : SND.play("tap");
  if (el.matches(".chipbtn, .back, .linkbtn, .navbtn, .resetq button")) return SND.play("soft");
  if (el.tagName !== "BUTTON") return SND.play("tap");
};
document.addEventListener("pointerdown", e => { if (e.button === 0 && e.pointerType !== "touch") uiSnd(e, true); }, true);
document.addEventListener("click", e => uiSnd(e, false), true);
document.addEventListener("input", e => { const r = e.target; if (r.type === "range") { const lo = +r.min || 0, hi = +r.max || 100; SND.play("tick", (r.value - lo) / (hi - lo || 1)); } });
document.addEventListener("click", e => { if (!e.target.closest(".snd")) return; SND.set(!SND.on); paintSnd(); SND.play("toggle"); });
new MutationObserver(paintSnd).observe(document.getElementById("app"), { childList: true });
paintSnd();

/* ---------- Sources ---------- */
function usedPhotos() { const u = new Set(THEMES.map(t => t.photo)); Object.values(CARDS).flat().forEach(c => photoKeys(c).forEach(k => u.add(k))); return u; }
function mediaCredits() { const out = []; Object.values(CARDS).flat().forEach(c => { if (hasClip(c)) out.push(c.clip.credit); if (c.listen && listenFig(c.listen)) out.push(c.listen.credit); }); return out; }
function sources() {
  document.title = "Sources · Denmark vs. the U.S.";
  app.innerHTML = `<div class="page" style="--theme:#F2F0EA">` + bar("Sources", "", 100) + `<main class="wrap"><section class="srcs">
    <p class="byline" style="margin:0">By <strong>Jens Kjeldgaard-Christiansen</strong><span class="aff">Department of English and American Studies Center Aarhus, Aarhus University</span></p>
    <h2>Where the numbers come from</h2>
    <p class="context">Every figure was checked against these pages on ${CHECKED}. Where the two countries measure something differently, the card says so.</p>
    <ul class="box">${Object.values(SRC).map(s => `<li><a href="${s.u}" target="_blank" rel="noopener">${s.t}</a></li>`).join("")}</ul>
    <p class="context">Population ratio on the home page: U.S. 341.8 million (July 1, 2025, Census Bureau) and Denmark 6.03 million (January 1, 2026, Statistics Denmark).</p>
    <h2>Photo credits</h2>
    <ul class="box">${Object.keys(CREDITS).filter(k => usedPhotos().has(k)).map(k => `<li>${CREDITS[k].t}. ${credLine(k)}</li>`).join("")}</ul>${mediaCredits().length ? `<h2>Film and audio</h2><ul class="box">${mediaCredits().map(x => `<li>${x}</li>`).join("")}</ul>` : ""}
  </section></main></div>`;
  app.querySelectorAll("[data-home]").forEach(b => b.addEventListener("click", () => go("home")));
}

/* ---------- Router ---------- */
function go(where) {
  if (where === "quiz") { startQuiz(); }
  if (CARDS[where]) { state.theme = where; state.idx = 0; state.dir = 1; }
  if (location.hash.slice(1) === where) route(); else location.hash = where;
  window.scrollTo({ top: 0 });
}
function route() {
  const [h, ix] = (location.hash.slice(1) || "home").split("/");
  if (CARDS[h]) {
    if (state.theme !== h) { state.theme = h; state.idx = ix != null && /^\d+$/.test(ix) ? Math.min(+ix, CARDS[h].length) : 0; }
    deck();
  }
  else if (h === "quiz") quiz();
  else if (h === "sources") sources();
  else home();
}
window.addEventListener("hashchange", route);
document.addEventListener("keydown", e => {
  if (!CARDS[location.hash.slice(1).split("/")[0]]) return;
  if (e.target.matches("input")) return;
  if (e.key === "ArrowRight") step(1); else if (e.key === "ArrowLeft") step(-1);
});
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", route);
new MutationObserver(route).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
route();
</script>
